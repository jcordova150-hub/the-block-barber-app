<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de personal — The Block Barber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Playfair+Display:ital,wght@1,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <img src="/assets/logo.jpg" alt="Logo">
    <h1 id="loginBizName">Panel de personal</h1>
    <p>Escribe la contraseña de personal para entrar</p>
    <div class="pass-wrap">
      <input type="password" id="loginPassword" placeholder="Contraseña">
      <button type="button" class="eye-btn" id="toggleLoginPass" aria-label="Mostrar contraseña">👁</button>
    </div>
    <div class="error-text" id="loginError"></div>
    <button class="btn" id="loginBtn" style="width:100%;">Entrar</button>
  </div>
</div>

<div id="appScreen" class="app" style="display:none;">

  <div class="masthead">
    <img src="/assets/logo.jpg" alt="Logo">
    <div class="titles">
      <h1 id="bizName">BARBERÍA</h1>
      <div class="tag" id="bizTaglineDisplay">Tarjeta de fidelidad</div>
    </div>
  </div>
  <div style="text-align:right; margin-bottom:20px; display:flex; gap:16px; justify-content:flex-end;">
    <button class="link-btn" id="editBizBtn">Editar datos del negocio</button>
    <button class="link-btn" id="logoutBtn">Cerrar sesión</button>
  </div>

  <div class="layout">
    <div>
      <h2 class="panel-title">Clientes</h2>
      <div class="client-list" id="clientList"></div>
      <div class="add-client">
        <input type="text" id="newName" placeholder="Nombre del cliente" maxlength="60">
        <input type="tel" id="newPhone" placeholder="Teléfono (opcional)" maxlength="30">
        <div class="error-text" id="addError"></div>
        <button class="btn" id="addClientBtn">Dar de alta cliente</button>
      </div>
    </div>

    <div>
      <h2 class="panel-title">Tarjeta</h2>
      <div id="cardStage">
        <div class="empty">Selecciona un cliente de la lista, o da de alta uno nuevo, para ver su tarjeta de sellos.</div>
      </div>
    </div>
  </div>

</div>

<div id="modalRoot"></div>

<script src="/app.js"></script>
</body>
</html>
